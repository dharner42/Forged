# Do not set server.port or server.address in this file.
# Streamlit Community Cloud routes to port 8501. A different port makes the
# platform report "application is down" and the deploy never becomes healthy.
# Local `make dashboard` still uses port 8741, passed on the command line.

[server]
headless = true
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1f4e5f"
backgroundColor = "#eef2f4"
secondaryBackgroundColor = "#ffffff"
textColor = "#1c2430"
font = "sans serif"
