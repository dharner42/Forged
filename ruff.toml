line-length = 120
target-version = "py312"

extend-exclude = [".venv", "notebooks", "data"]

[lint]
# Pyflakes plus the pycodestyle rules that catch real mistakes.
# E402 is ignored because the Streamlit pages import after putting the repo root on sys.path.
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]

[lint.per-file-ignores]
"app/Home.py" = ["N999"]
"app/pages/*.py" = ["N999"]
